workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Extract zip archive
        script: |
          unzip -o khazna_phase1.zip
          # نقل كل الملفات من الفولدر المفكوك للمسار الرئيسي
          cp -r khazna_phase1/* . 2>/dev/null || cp -r KhaznaApp/* . 2>/dev/null || true
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Build iOS App
        script: |
          flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app
