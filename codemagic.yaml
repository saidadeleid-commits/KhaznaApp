workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Extract zip archive
        script: |
          # فك الملفات للسطح مباشرة بدون تعقيد
          unzip -o khazna_phase1.zip
          find . -mindepth 2 -maxdepth 2 -name "pubspec.yaml" -execdir cp -r . /Users/builder/clone/ \;
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Build iOS App
        script: |
          flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app
